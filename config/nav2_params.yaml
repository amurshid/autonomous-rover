bt_navigator:
  ros__parameters:
    global_frame: map
    robot_base_frame: base_link
    odom_topic: /odom
    bt_loop_duration: 10
    # Kept from the later tuning at the user's request: milliseconds the tree
    # waits for a server to *acknowledge* a goal, not to act on it. At 20 a
    # working goal was lost -- compute_path_to_pose, spin, wait, backup and a
    # costmap service all timed out inside 270ms while the rover was driving
    # fine, and "spin completed successfully" arrived four seconds later. The
    # servers were healthy; they just could not answer in 20ms on a Pi with
    # ordinary scheduling jitter. Costs nothing when they answer promptly.
    default_server_timeout: 200
    transform_tolerance: 0.5

controller_server:
  ros__parameters:
    controller_frequency: 10.0
    min_x_velocity_threshold: 0.001
    min_theta_velocity_threshold: 0.001
    odom_topic: /odom
    failure_tolerance: 0.5
    progress_checker_plugin: "progress_checker"
    goal_checker_plugins: ["goal_checker"]
    controller_plugins: ["FollowPath"]

    progress_checker:
      plugin: "nav2_controller::SimpleProgressChecker"
      required_movement_radius: 0.25
      movement_time_allowance: 45.0

    goal_checker:
      plugin: "nav2_controller::SimpleGoalChecker"
      xy_goal_tolerance: 0.20
      yaw_goal_tolerance: 3.14
      stateful: True

    FollowPath:
      plugin: "nav2_regulated_pure_pursuit_controller::RegulatedPurePursuitController"
      desired_linear_vel: 0.7
      lookahead_dist: 0.5
      min_lookahead_dist: 0.3
      max_lookahead_dist: 0.8
      lookahead_time: 1.5
      transform_tolerance: 0.5
      # Nothing publishes /odom on this rover, so velocity scaling read zero
      # speed and pinned the lookahead at min_lookahead_dist, 0.3 m. On a drive
      # the angular command then sat at desired_linear_vel /
      # regulated_linear_scaling_min_radius -- exactly 1.40 -- most of the way,
      # broken by full stops and rotate-in-place bursts: slow, pulsing driving.
      # Use lookahead_dist as a fixed lookahead instead.
      use_velocity_scaled_lookahead_dist: false
      min_approach_linear_velocity: 0.06
      approach_velocity_scaling_dist: 0.5
      use_collision_detection: true
      max_allowed_time_to_collision_up_to_carrot: 1.5
      use_regulated_linear_velocity_scaling: true
      use_cost_regulated_linear_velocity_scaling: false
      regulated_linear_scaling_min_radius: 0.5
      regulated_linear_scaling_min_speed: 0.25
      use_rotate_to_heading: true
      rotate_to_heading_min_angle: 0.9
      rotate_to_heading_angular_vel: 10.0
      max_angular_accel: 200.0
      allow_reversing: false
      max_robot_pose_search_dist: 5.0

local_costmap:
  local_costmap:
    ros__parameters:
      update_frequency: 5.0
      publish_frequency: 0.5
      global_frame: odom
      robot_base_frame: base_link
      rolling_window: true
      width: 6
      height: 6
      resolution: 0.05
      # The chassis, 194 x 168 mm (Waveshare's outline dimensions), with
      # base_link at its centre. robot_radius 0.13 modelled it as a 0.26 m
      # circle -- 55% wider than its sides -- so the collision check stopped
      # for walls the rover would have cleared whenever it was off-centre.
      footprint: "[[0.097, 0.084], [0.097, -0.084], [-0.097, -0.084], [-0.097, 0.084]]"
      footprint_padding: 0.01
      transform_tolerance: 0.5
      plugins: ["obstacle_layer", "inflation_layer"]
      obstacle_layer:
        plugin: "nav2_costmap_2d::ObstacleLayer"
        enabled: True
        observation_sources: scan
        scan:
          # /scan_fixed, not /scan. The LD19's own stamps go backwards --
          # that is why scan_timestamp_relay exists -- and Cartographer has
          # always consumed the corrected topic. On /scan the two halves of
          # the stack disagree about when each scan happened, by as much as
          # the 0.15s the relay corrects.
          topic: /scan_fixed
          sensor_frame: base_laser
          data_type: "LaserScan"
          clearing: True
          marking: True
          min_obstacle_height: -0.5
          max_obstacle_height: 2.0
          obstacle_max_range: 6.0
          obstacle_min_range: 0.12
          raytrace_max_range: 7.0
          raytrace_min_range: 0.12
      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        cost_scaling_factor: 3.0
        inflation_radius: 0.25
      always_send_full_costmap: False

global_costmap:
  global_costmap:
    ros__parameters:
      update_frequency: 1.0
      publish_frequency: 1.0
      global_frame: map
      robot_base_frame: base_link
      resolution: 0.05
      # The chassis, 194 x 168 mm (Waveshare's outline dimensions), with
      # base_link at its centre. robot_radius 0.13 modelled it as a 0.26 m
      # circle -- 55% wider than its sides -- so the collision check stopped
      # for walls the rover would have cleared whenever it was off-centre.
      footprint: "[[0.097, 0.084], [0.097, -0.084], [-0.097, -0.084], [-0.097, 0.084]]"
      footprint_padding: 0.01
      track_unknown_space: true
      transform_tolerance: 0.5
      plugins: ["static_layer", "obstacle_layer", "inflation_layer"]
      static_layer:
        plugin: "nav2_costmap_2d::StaticLayer"
        map_subscribe_transient_local: True
      obstacle_layer:
        plugin: "nav2_costmap_2d::ObstacleLayer"
        enabled: True
        observation_sources: scan
        scan:
          # /scan_fixed, not /scan. The LD19's own stamps go backwards --
          # that is why scan_timestamp_relay exists -- and Cartographer has
          # always consumed the corrected topic. On /scan the two halves of
          # the stack disagree about when each scan happened, by as much as
          # the 0.15s the relay corrects.
          topic: /scan_fixed
          sensor_frame: base_laser
          data_type: "LaserScan"
          clearing: True
          marking: True
          min_obstacle_height: -0.5
          max_obstacle_height: 2.0
          obstacle_max_range: 6.0
          obstacle_min_range: 0.12
          raytrace_max_range: 7.0
          raytrace_min_range: 0.12
      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        cost_scaling_factor: 3.0
        # At 0.25 the cost fell away within a few cm of the footprint and NavFn
        # rode its edge: 18.6% of the planned tour within 0.30 m of a wall, and
        # the legs that hugged walls logged most of the 'collision ahead' stops.
        # 0.45 halves that (8.9%) for 6% more path; 0.55 bought nothing more.
        # Global only -- the controller's collision check reads lethal cells.
        inflation_radius: 0.45
      always_send_full_costmap: False

map_server:
  ros__parameters:
    yaml_filename: "/home/amurshid/house_map.yaml"

planner_server:
  ros__parameters:
    expected_planner_frequency: 1.0
    planner_plugins: ["GridBased"]
    GridBased:
      plugin: "nav2_navfn_planner/NavfnPlanner"
      tolerance: 0.6
      use_astar: false
      allow_unknown: true

behavior_server:
  ros__parameters:
    local_costmap_topic: local_costmap/costmap_raw
    global_costmap_topic: global_costmap/costmap_raw
    local_footprint_topic: local_costmap/published_footprint
    global_footprint_topic: global_costmap/published_footprint
    cycle_frequency: 10.0
    behavior_plugins: ["spin", "backup", "wait"]
    spin:
      plugin: "nav2_behaviors/Spin"
    backup:
      plugin: "nav2_behaviors/BackUp"
    wait:
      plugin: "nav2_behaviors/Wait"
    global_frame: odom
    robot_base_frame: base_link
    transform_tolerance: 0.5
    simulate_ahead_time: 1.0
    max_rotational_vel: 10.0
    min_rotational_vel: 6.0
    rotational_acc_lim: 200.0
