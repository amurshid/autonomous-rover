# AMCL localisation against the static house map.
#
# Written as a trial alternative to Cartographer pure localisation, which
# locks onto submaps it builds itself and then has to be restarted. AMCL
# never builds a map, so that failure mode does not exist here: every update
# scores particles against house_map.yaml and nothing else.
#
# Odometry comes from laser_scan_matcher, not wheels -- the WAVE ROVER bridge
# is open loop and reports no wheel feedback. See amcl_localization.launch.py.

amcl:
  ros__parameters:
    use_sim_time: false

    base_frame_id: "base_link"
    odom_frame_id: "odom"
    global_frame_id: "map"
    # /scan_fixed, not /scan. The LD19's own stamps go backwards, which the
    # relay corrects; the same reason both costmaps use it.
    #
    # scan_deskew.py sat here for a while, un-warping intra-scan rotation.
    # It made no observable difference either way and is out of the pipeline;
    # see the note at the top of that file before wiring it back in.
    scan_topic: /scan_fixed
    map_topic: /map
    tf_broadcast: true
    # Matches nav2_params.yaml. A Pi under load misses tighter tolerances.
    transform_tolerance: 0.5

    # seed_pose.py already publishes PoseWithCovarianceStamped to
    # /initialpose at boot, which AMCL subscribes to natively. So no initial
    # pose is baked in here, and set_initial_pose.py is not needed at all --
    # it exists only to bridge /initialpose into Cartographer's trajectory
    # services, which have no equivalent here.
    set_initial_pose: false
    always_reset_initial_pose: false

    robot_model_type: "nav2_amcl::DifferentialMotionModel"
    # alpha1/alpha2 raised from 0.3 to 0.7. These say how far AMCL distrusts
    # the odometry's ROTATION, and the observed failure is the pose slowly
    # rotating away from the walls while driving. laser_scan_matcher's
    # heading is the weak part of its estimate -- a 100 ms sweep taken while
    # turning is not a rigid snapshot, and csm has no motion prior to lean
    # on -- so at 0.3 the filter was following bad odometry rotation instead
    # of believing the scan match against the map. Higher means the laser
    # wins that argument.
    #
    # Translation noise (alpha3/alpha4) left alone: the matcher's position
    # is the half it does well, and loosening everything at once would just
    # make the cloud fat in every direction.
    alpha1: 0.7      # rotation noise from rotation
    alpha2: 0.7      # rotation noise from translation
    alpha3: 0.3      # translation noise from translation
    alpha4: 0.3      # translation noise from rotation
    alpha5: 0.2

    # Deliberately modest. The board runs at load 5.65 on 4 cores before
    # anything is added, and Cartographer was taking 53% of a core; the point
    # of this experiment is partly to spend less than that.
    min_particles: 300
    max_particles: 1500
    pf_err: 0.05
    pf_z: 0.99

    update_min_d: 0.15
    update_min_a: 0.15
    resample_interval: 1

    # Augmented MCL, DISABLED for now -- these were 0.001 / 0.1.
    #
    # It injects random particles when the average match likelihood falls,
    # which is the textbook kidnapped-robot recovery and was the headline
    # argument for AMCL over Cartographer. On this rover it backfired: the
    # pose drifts slowly during driving, the likelihood falls with it, the
    # injection fires, and the filter re-converges somewhere else entirely
    # -- observed as the scans jumping to a different part of the house.
    # In a map with this much repeated geometry (parallel corridors, similar
    # rooms) a scattered filter has plenty of wrong places to land.
    #
    # Turning it off makes drift stay drift instead of becoming teleportation.
    # Drift is visible and correctable; a confident jump across the house is
    # neither. Revisit once the underlying drift is understood.
    recovery_alpha_slow: 0.0
    recovery_alpha_fast: 0.0

    laser_model_type: "likelihood_field"
    laser_likelihood_max_dist: 2.0
    # Back to 8.0, matching the range Cartographer used to BUILD the map.
    # 12.0 was tried on the theory that seeing further down a corridor
    # breaks the along-axis ambiguity. It was never validated, and it has a
    # real cost: the LD19's returns get noisy well before its 12 m spec
    # indoors, and beams landing at 9-12 m are matched against geometry the
    # map assembled from other viewpoints. Bad long beams lower the match
    # score for a correct pose, which is the opposite of helpful.
    laser_min_range: 0.1
    laser_max_range: 8.0
    # 120 of the LD19's ~499 points, up from 60. Sixty is thin for pinning
    # down YAW specifically -- which is the axis observed rotating away --
    # because heading is constrained by the angular distribution of hits,
    # and half the beams is half the evidence. Costs CPU linearly; if the
    # board cannot take it, this is the first thing to put back.
    max_beams: 120
    sigma_hit: 0.2
    z_hit: 0.5
    z_rand: 0.5
    z_max: 0.05
    z_short: 0.05
    lambda_short: 0.1
    do_beamskip: false

    save_pose_rate: 0.5
